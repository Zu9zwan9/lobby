name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build release app bundle
        run: make app
      # LobbyCheck exits 1 when the runner's network needs action, which is not
      # a build failure. We only assert that it runs and produces output.
      - name: Smoke test the diagnostic CLI
        run: swift run -c release LobbyCheck || true
